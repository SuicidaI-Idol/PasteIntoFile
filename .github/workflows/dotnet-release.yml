name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned release
    runs-on: windows-2025
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $source = Get-Content PasteIntoFile/Properties/AssemblyInfo.cs -Raw
          $match = [regex]::Match($source, 'AssemblyVersion\("(\d+\.\d+\.\d+)"\)')
          if (-not $match.Success -or $env:RELEASE_TAG -ne "v$($match.Groups[1].Value)") {
            throw 'The release tag must match the Release assembly version (vMAJOR.MINOR.PATCH).'
          }

      - name: Rebuild application and packages
        shell: powershell
        run: ./Rebuild-All.ps1

      - name: Upload unsigned release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $zip = Get-ChildItem dist/*_portable.zip | Select-Object -First 1
          $msi = Get-ChildItem dist/*_installer.msi | Select-Object -First 1
          if (-not $zip -or -not $msi) { throw 'Release assets were not generated.' }
          $zipName = "dist/PasteIntoFile_${env:RELEASE_TAG}_portable_unsigned.zip"
          $msiName = "dist/PasteIntoFile_${env:RELEASE_TAG}_installer_unsigned.msi"
          Move-Item -LiteralPath $zip.FullName -Destination $zipName
          Move-Item -LiteralPath $msi.FullName -Destination $msiName
          gh release upload $env:RELEASE_TAG $zipName $msiName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
